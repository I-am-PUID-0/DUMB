name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
    paths:
      - "api/**"
      - "utils/**"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/**"
      - ".github/.release-please-manifest.json"
      - ".github/release-please-config.json"
  push:
    branches:
      - dev
      - master
    paths:
      - "api/**"
      - "utils/**"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/**"
      - ".github/.release-please-manifest.json"
      - ".github/release-please-config.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      DUMB_AUTH_CONFIG_PATH: /tmp/dumb-ci/users.json
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry>=2.0,<3.0"

      - name: Poetry lock check
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: Project metadata
        run: poetry run python scripts/verify_project.py

      - name: Black format check
        run: poetry run black --check api utils tests scripts

      - name: Ruff lint
        run: poetry run ruff check api utils tests scripts

      - name: Syntax compile
        env:
          PYTHONPYCACHEPREFIX: /tmp/dumb-pycache
        run: poetry run python -m compileall -q api utils tests scripts

      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tini gpgv gnupg ffmpeg
          /usr/bin/ffmpeg -version

      - name: Unit tests
        run: poetry run python -m unittest discover -s tests

      - name: Security checks
        run: make security

  dev-version-checks:
    name: Dev version automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the pinned release calculator
        run: npm ci --prefix scripts/dev-version --ignore-scripts

      - name: Dev release calculation regressions
        run: npm test --prefix scripts/dev-version

      - name: Release calculator dependency audit
        run: npm audit --prefix scripts/dev-version --audit-level=moderate
